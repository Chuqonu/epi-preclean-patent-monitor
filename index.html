<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="epi-report-data" content="data/report.json?v=734b2c7596cd">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EPI / Preclean Patent Monitoring Report</title>
  <meta name="description" content="Independent Si/SiGe epi and preclean patent monitoring report for GitHub Pages.">
  <link rel="stylesheet" href="assets/css/report.css?v=f60b87bf5c39">
</head>
<body>
  <div class="shell">
    <aside class="side" id="side-panel" aria-label="检索目录">
      <div class="side-meta" id="side-meta">
        <a class="side-home" href="./">EPI / Preclean 专利监测</a>
      </div>
      <div class="side-filters" id="side-filters" aria-label="筛选">
        <div class="chip-group" data-filter-group="domain">
          <span class="chip-group-label">类型</span>
          <button type="button" class="filter-chip" data-filter="hardware" aria-pressed="false">硬件</button>
          <button type="button" class="filter-chip" data-filter="process" aria-pressed="false">工艺</button>
        </div>
        <div class="chip-group" data-filter-group="lane">
          <span class="chip-group-label">领域</span>
          <button type="button" class="filter-chip" data-filter="epi" aria-pressed="false">EPI</button>
          <button type="button" class="filter-chip" data-filter="preclean" aria-pressed="false">Preclean</button>
        </div>
        <div class="filter-bar">
          <span class="filter-count" id="filter-count" aria-live="polite"></span>
          <button type="button" class="filter-clear" id="filter-clear" hidden>清除筛选</button>
        </div>
      </div>
      <nav id="tree" aria-label="按月专利目录"></nav>
    </aside>
    <button
      type="button"
      class="sidebar-resizer"
      id="resizer"
      aria-label="拖动调整目录宽度"
      title="拖动调整目录宽度"
    ></button>
    <button type="button" class="toc-drawer-toggle" id="toc-drawer-toggle" aria-expanded="false" aria-controls="side-panel tree">
      <span class="toc-drawer-icon" aria-hidden="true">☰</span> 目录
    </button>
    <main class="main" id="main">
      <div id="content" aria-live="polite"></div>
      <footer class="report-footer" id="banner" aria-label="报告信息"></footer>
    </main>
  </div>
  <div id="figure-label-popup" class="figure-label-popup" role="dialog" aria-modal="false" hidden>
    <button type="button" class="figure-label-popup-close" aria-label="关闭">×</button>
    <strong class="figure-label-popup-title"></strong>
    <p class="figure-label-popup-desc"></p>
  </div>
  <script src="assets/js/report.js?v=0188acb4620b" defer></script>
</body>
</html>
